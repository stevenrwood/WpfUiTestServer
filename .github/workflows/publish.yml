name: publish

# Pack on every push/PR (build check); publish to NuGet only on a version tag.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pack
        run: dotnet pack -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.*nupkg

  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # Trusted Publishing: no stored API key. GitHub's OIDC token is exchanged for
    # a short-lived NuGet key at push time. Requires a Trusted Publishing policy on
    # nuget.org for this repo + workflow (see README/CLAUDE.md).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pack
        run: dotnet pack -c Release -o artifacts
      - name: NuGet login (Trusted Publishing → temporary key)
        id: login
        uses: NuGet/login@v1
        with:
          user: stevenrwood # nuget.org username that owns the Trusted Publishing policy
      - name: Push to NuGet
        run: >
          dotnet nuget push artifacts/*.nupkg
          -k ${{ steps.login.outputs.NUGET_API_KEY }}
          -s https://api.nuget.org/v3/index.json
          --skip-duplicate
